# One-command local run (FR-012). `make up` starts PostgreSQL + the api process;
# the api applies migrations before serving (migrate-before-serve, FR-022).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: riverbend_migrator
      POSTGRES_PASSWORD: mig_pw
      POSTGRES_DB: riverbend
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverbend_migrator -d riverbend"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://app_user:app_pw@db:5432/riverbend
      DATABASE_ADMIN_URL: postgres://app_admin:admin_pw@db:5432/riverbend
      DATABASE_MIGRATOR_URL: postgres://riverbend_migrator:mig_pw@db:5432/riverbend
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-dev-only-admin-secret-change-me}
      LOG_LEVEL: info
      # Public web form (005) — off unless a signing key is provided (fail-closed).
      WEB_FORM_SIGNING_KEY: ${WEB_FORM_SIGNING_KEY:-}
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Email (006/D21): inbound Resend webhook on the api. Off unless both are set. The api holds NO
      # provider API key — it only verifies the Svix signature and durably records the event.
      EMAIL_SIGNING_KEY: ${EMAIL_SIGNING_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_REPLY_DOMAIN: ${RESEND_REPLY_DOMAIN:-riverbend.example}
    ports:
      - "8080:8080"
    command: ["npm", "run", "start:api"]

  # LiteLLM proxy (D6): the ONLY component that holds the backing-provider key. Internal-only —
  # no host port is published; reachable on the compose network as http://litellm:4000.
  # OPT-IN: behind the "llm" profile, so the default `make up` stays fully offline on the FakeGateway
  # (no key required). Enable with:  docker compose --profile llm up   (after setting the keys in .env).
  # Production MUST pin this image by digest (supply-chain containment, D6); the moving tag is local-only.
  litellm:
    # Pinned by digest (D6 supply-chain containment). Tag kept for readability; the digest is what binds.
    image: ghcr.io/berriai/litellm:main-stable@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    profiles: ["llm"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      # Backing-provider key — read ONLY by the proxy (never passed to the app, browser, or logs).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The proxy requires a master key; used ONLY for provisioning (admin), never ordinary inference.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Isolated persistence for native budgets/teams/keys/spend (2.0.0): its own DB + restricted role.
      DATABASE_URL: postgresql://litellm_app:litellm_pw@db:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    # Bound to loopback only: reachable by the operator at 127.0.0.1:4000, never on external interfaces.
    # The worker reaches it in-network as http://litellm:4000.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app_user:app_pw@db:5432/riverbend
      DATABASE_ADMIN_URL: postgres://app_admin:admin_pw@db:5432/riverbend
      DATABASE_MIGRATOR_URL: postgres://riverbend_migrator:mig_pw@db:5432/riverbend
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-dev-only-admin-secret-change-me}
      MAX_PROCESSING_ATTEMPTS: "3"
      QUEUE_EXPIRE_SECONDS: "120"
      RECONCILER_INTERVAL_MS: "10000"
      LOG_LEVEL: info
      # Email (006/D21): worker sends outbound via Resend + drains inbound/delivery events. Off unless
      # EMAIL_SIGNING_KEY is set; Resend is used only when RESEND_API_KEY is set (else an in-memory no-op).
      EMAIL_SIGNING_KEY: ${EMAIL_SIGNING_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Riverbend Cycles <onboarding@resend.dev>}
      RESEND_REPLY_DOMAIN: ${RESEND_REPLY_DOMAIN:-riverbend.example}
      # Resilience (007): AI kill switch + breaker + per-shop bulkhead (defaults are sane).
      AI_PAUSED: ${AI_PAUSED:-false}
      # Real provider via the proxy — OPT-IN. Empty by default → the worker uses the FakeGateway (empty
      # strings are treated as unset by config). Set these in .env + run `--profile llm` to go live.
      # NOTE: the worker gets NO OPENAI_API_KEY. For native budgets (2.0.0) it holds only the MASTER key
      # (provisioning) + resolves a per-shop virtual key at runtime; it never uses the master for inference.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      BUDGET_AUTHORITY: ${BUDGET_AUTHORITY:-litellm}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
    command: ["npm", "run", "start:worker"]

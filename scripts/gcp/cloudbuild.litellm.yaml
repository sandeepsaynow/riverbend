# Cloud Build config for the custom LiteLLM image (bakes litellm/config.yaml). Build context = repo root.
#   gcloud builds submit --config scripts/gcp/cloudbuild.litellm.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/litellm/Dockerfile
      - -t
      - ${_AR}/litellm:latest
      - .
images:
  - ${_AR}/litellm:latest
substitutions:
  # _AR is passed explicitly by the deploy script (--substitutions _AR=<region>-docker.pkg.dev/<project>/riverbend).
  # Not derived from ${LOCATION} because that is not a built-in Cloud Build substitution.
  _AR: ""
options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

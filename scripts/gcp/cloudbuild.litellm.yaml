# Cloud Build config for the custom LiteLLM image (bakes litellm/config.yaml). Build context = repo root.
#   gcloud builds submit --config scripts/gcp/cloudbuild.litellm.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/litellm/Dockerfile
      - -t
      - ${_AR}/litellm:latest
      - .
images:
  - ${_AR}/litellm:latest
substitutions:
  _AR: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/riverbend
options:
  logging: CLOUD_LOGGING_ONLY

# LiteLLM proxy configuration (D6 + budget authority 2.0.0): worker → LlmGateway → LiteLLM proxy →
# OpenAI. The proxy holds the provider key (its own env) and is the SOLE active budget authority:
# one team per shop, restricted virtual keys, fail-closed admission. It persists teams/keys/spend in
# its OWN PostgreSQL database (DATABASE_URL in docker-compose) — isolated from Riverbend's database.
model_list:
  - model_name: riverbend-extraction        # production: logical alias → backing OpenAI model
    litellm_params:
      # Upgraded 2026-11-06 (D26) gpt-4o-mini → gpt-5.4-mini snapshot. Verified: LiteLLM 1.106.6 has
      # price metadata ($0.75/1M in, $4.50/1M out) so x-litellm-response-cost stays accurate, and
      # json_schema strict structured output works. ROLLBACK: swap the next line back to
      # `openai/gpt-4o-mini` and restart the proxy — the alias, env, and app code are unchanged.
      model: openai/gpt-5.4-mini-2026-03-17
      api_key: os.environ/OPENAI_API_KEY     # read from the proxy's env — value never stored here

  - model_name: mock-extract                 # testing: a MOCK upstream with configured pricing, so
    litellm_params:                          # budget admission can be verified with NO paid calls.
      model: openai/gpt-4o-mini
      mock_response: '{"kind":"repair","bikes":[{"bikeNumber":1,"issues":["tune"],"serviceCodes":["TUNE_BASIC"]}],"urgency":"normal","dateWords":null,"questionDraft":null}'
      input_cost_per_token: 0.001
      output_cost_per_token: 0.001

litellm_settings:
  drop_params: true
  # Phase 6 aggregate evaluation cap: a chain-wide spend ceiling comfortably below the USD 20 assignment
  # limit. Applies across all virtual keys/teams; the master key is confined to provisioning, so the
  # evaluation (which uses per-shop virtual keys) cannot bypass it.
  max_budget: 15
  budget_duration: 30d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # provisioning/admin path only; never ordinary inference
